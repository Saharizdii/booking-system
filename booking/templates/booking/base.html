<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}سالن زیبایی نگین | رزرو آنلاین نوبت{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet">

  <style>
    :root {
      --pink: #d81b7a;
      --pink-dark: #b01462;
      --pink-soft: #ffe3f1;
      --violet: #5b2a86;
      --violet-dark: #2e1250;
      --violet-soft: #ece1fa;
      --orange: #ff7a2f;
      --orange-soft: #ffe9dc;
      --yellow: #ffc83d;
      --ink: #26142e;
      --muted: #6d5a78;
      --bg: #fff8fc;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      font-size: 1.05rem;
      line-height: 1.9;
      background: var(--bg);
      color: var(--ink);
    }
    h1, h2, h3, h4, h5, h6 { font-weight: 800; line-height: 1.5; }
    .container { max-width: 1140px; }

    /* نوار بالا */
    .navbar {
      background: rgba(255,255,255,.95) !important;
      backdrop-filter: blur(8px);
      padding: .8rem 0;
    }
    .navbar-brand {
      color: var(--violet-dark) !important;
      font-weight: 900;
      font-size: 1.35rem;
    }
    .navbar-brand i { color: var(--pink); }
    .nav-link { color: var(--ink) !important; font-weight: 600; padding: .5rem 1rem !important; }
    .nav-link:hover { color: var(--pink) !important; }

    /* بخش اصلی */
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--violet-dark) 0%, var(--violet) 55%, #8a2fa8 100%);
      color: #fff;
      padding: 6.5rem 0 6rem;
    }
    .hero::before, .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
    }
    .hero::before {
      width: 460px; height: 460px; top: -170px; left: -130px;
      background: radial-gradient(circle, rgba(216,27,122,.65), transparent 70%);
    }
    .hero::after {
      width: 400px; height: 400px; bottom: -190px; right: -110px;
      background: radial-gradient(circle, rgba(255,200,61,.5), transparent 70%);
    }
    .hero .container { position: relative; z-index: 1; }
    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 50px;
      padding: .4rem 1.3rem;
      font-size: .95rem;
      font-weight: 600;
      margin-bottom: 1.4rem;
      color: var(--yellow);
    }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 900; }
    .hero h1 span {
      background: linear-gradient(90deg, #ffd35a, #ff8fc4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero .lead { color: #f1e7fb; font-size: 1.15rem; }

    .btn-rose {
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      border: 0;
      color: #fff;
      font-weight: 700;
      border-radius: 50px;
      padding: .8rem 2.3rem;
      box-shadow: 0 8px 20px rgba(216,27,122,.35);
      transition: transform .2s, box-shadow .2s;
    }
    .btn-rose:hover {
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(216,27,122,.45);
    }
    .btn-rose.disabled, .btn-rose:disabled {
      background: #e7d9e2;
      color: #7a6a76;
      box-shadow: none;
      opacity: 1;
    }
    .btn-ghost {
      border: 2px solid rgba(255,255,255,.7);
      color: #fff;
      font-weight: 600;
      border-radius: 50px;
      padding: .75rem 2.2rem;
    }
    .btn-ghost:hover { background: #fff; color: var(--violet-dark); }

    /*عنوان بخش ها*/

    .section-title { text-align: center; margin-bottom: 3rem; }
    .section-title small {
      color: var(--pink);
      font-weight: 700;
      letter-spacing: 2px;
    }
    .section-title h2 { font-size: 2rem; margin-top: .3rem; color: var(--violet-dark); }
    .section-title .line {
      width: 70px; height: 5px; margin: 1rem auto 0;
      background: linear-gradient(90deg, var(--pink), var(--yellow));
      border-radius: 5px;
    }

    /* کارت خدمت */
    .service-card {
      border: 0;
      border-radius: 1.4rem;
      background: #fff;





      /* کارت خدمت */
    .service-card {
        border: 0;
        border-radius: 1.4rem;
        background: #fff; 
        box-shadow: 0 8px 28px rgba(91,42,134,.10);
        transition: transform .25s, box-shadow .25s;
        overflow: hidden;
        position: relative;
    }
    .service-card::before {
        content: "";
        position: absolute; top: 0; right: 0;left: 0; height: 6px;
        background: var(--accent, var(--pink));
    }
    .service-card:hover { 
        transform: translateY(-6px);
        box-shadow: 0 16px 36px rgba(91,42,134,.18);
    } 
    .service-card .card-body {
        display: flex;
        flex-direction: column;
        padding: 2rem 1.7rem 1.7rem; 
    } 
    .service-card h5 {
         font-size: 1.25rem;
     } 
     .service-card .btn { margin-top: auto; } 
     
     .icon-circle { 
        width: 66px; height: 66px;
        border-radius: 20px;
        background: var(--accent-soft, var(--pink-soft)); 
        color: var(--accent, var(--pink)); 
        display: flex; align-items: center; justify-content: center;
        font-size: 1.9rem;
    } 
    .row > div:nth-child(3n+1) .service-card { --accent: var(--pink); --accent-soft: var(--pink-soft); }
    .row > div:nth-child(3n+2) .service-card { --accent: var(--violet); --accent-soft: var(--violet-soft); }
    .row > div:nth-child(3n+3) .service-card { --accent: var(--orange); --accent-soft: var(--orange-soft); }
   
    .price { color: var(--pink-dark); font-weight: 800; font-size: 1.2rem; }
     
    /* چرا ما */ 
    .why { background: #fff; } 
    .why-item .icon-circle {
        margin: 0 auto 1.2rem;
        background: linear-gradient(135deg, var(--violet), var(--pink));
        color: #fff;
    } 
    .why-item h5 { color: var(--violet-dark);
    } 
    .why-item p { color: var(--muted); }
    
    /* تیم */ 
    .stylist-card {
        background: #fff;
        border-radius: 1.4rem;
        padding: 2rem 1.2rem;
        text-align: center; 
        box-shadow: 0 8px 28px rgba(91,42,134,.10); 
        height: 100%; 
    } 
    .stylist-avatar { 
        width: 92px; height: 92px; margin: 0 auto 1rem; 
        border-radius: 50%; 
        background: linear-gradient(135deg, var(--pink), 
        var(--orange)); 
        color: #fff; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        font-size: 2.4rem; 
        box-shadow: 0 8px 18px rgba(216,27,122,.3); 
    }
    /* تماس و فوتر */ 
    .contact-box { 
        background: linear-gradient(135deg, var(--violet-dark), var(--violet)); 
        color: #fff; 
        border-radius: 1.8rem; 
        padding: 3rem 2.5rem; 
    } 
    .contact-box i { 
        color: var(--yellow); 
        margin-left: .4rem; 
    } 
    footer { background: var(--violet-dark); color: #d9c8ea; } 
    @media (max-width: 576px) { 
        .hero { padding: 4.5rem 0 4rem; } 
        .contact-box { padding: 2rem 1.4rem; } 
    } 
   </style> 
</head> 
<body> 
    
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm"> 
        <div class="container"> 
            <a class="navbar-brand" href="{% url 'booking:home' %}"> 
                <i class="bi bi-scissors"></i> سالن زیبایی نگین 
            </a> 
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"> 
                <span class="navbar-toggler-icon"></span> 
            </button> 
            <div class="collapse navbar-collapse" id="nav"> 
                <ul class="navbar-nav ms-auto me-lg-4"> 
                    <li class="nav-item"><a class="nav-link" href="#services">خدمات</a></li> 
                    <li class="nav-item"><a class="nav-link" href="#team">تیم ما</a></li> 
                    <li class="nav-item"><a class="nav-link" href="#contact">تماس با ما</a></li> 
                </ul> 
            </div> 
        </div> 
    </nav>
    {% block content %}{% endblock %} 
    <footer class="text-center py-4 mt-5"> 
        <small>© سالن زیبایی نگین · رزرو آنلاین نوبت</small> 
    </footer> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
</body> 
</html>
